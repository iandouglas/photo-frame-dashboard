<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F2EEE6">
  <title>Frame</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <section class="col col-agenda">
      <header class="col-head">
        <h2 id="agendaLabel">Agenda</h2>
        <div class="seg hidden" id="seg" role="tablist">
          <button class="is-on" data-tab="agenda" role="tab">Agenda</button><button data-tab="news" role="tab">News</button>
        </div>
        <div class="legend" id="legend"></div>
      </header>

      <div class="pane" id="agendaPane">
        <div class="panel">
          <div class="agenda-nav">
            <button class="nav-btn" id="dayPrev" aria-label="Previous day"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="nav-day" id="dayLabel" aria-label="Back to today"></button>
            <button class="nav-btn" id="dayNext" aria-label="Next day"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <div class="agenda" id="agenda"><p class="empty">Loading calendars…</p></div>
        </div>
        <div class="status" id="calStatus"></div>
      </div>

      <div class="pane hidden" id="newsPane">
        <div class="panel">
          <div class="news" id="news"><p class="empty">Loading headlines…</p></div>
        </div>
        <div class="status" id="newsStatus"></div>
      </div>
    </section>

    <section class="col col-now">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="wx-now" id="wxNow"></div>
      <div class="sun" id="sun"></div>
      <div class="wx-days" id="wxDays"></div>
    </section>

    <section class="col col-tools">
      <div class="tool-bar">
        <button class="tool-btn hidden" id="btnSettings" aria-label="Android settings"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button class="tool-btn" id="btnSleep" aria-label="Turn the screen off"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      </div>
      <div class="card alert-card" id="alertCard">
        <div class="card-label">Next meeting</div>
        <div id="alertBody"><p class="empty">Nothing coming up</p></div>
      </div>

      <div class="card pomo" id="pomo">
        <div class="card-label"><span>Pomodoro</span><button class="link" id="pomoGear" aria-label="Pomodoro settings">Settings</button></div>
        <div id="pomoMain">
          <div class="pomo-phase" id="pomoPhase">Focus</div>
          <div class="pomo-time" id="pomoTime">25:00</div>
          <div class="bar"><div class="bar-fill" id="pomoBar"></div></div>
          <div class="pomo-count" id="pomoCount"></div>
          <div class="btn-row">
            <button class="btn btn-primary" id="pomoStart">Start</button>
            <button class="btn" id="pomoSkip">Skip</button>
            <button class="btn" id="pomoReset">Reset</button>
          </div>
        </div>
        <div id="pomoSettings" class="pomo-settings hidden"></div>
      </div>

      <div class="card text-card hidden" id="textCard">
        <div class="card-label hidden" id="textTitle"></div>
        <div class="text-body" id="textBody"></div>
      </div>
    </section>
  </div>

  <div class="blackout hidden" id="blackout"></div>

  <div class="flash hidden" id="flash" role="alertdialog" aria-live="assertive">
    <div class="flash-inner">
      <div class="flash-when" id="flashWhen"></div>
      <div class="flash-title" id="flashTitle"></div>
      <div class="flash-meta" id="flashMeta"></div>
      <button class="ack" id="ack">ACK</button>
    </div>
  </div>

  <div class="offline hidden" id="offline">Can't reach the server — showing the last data</div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
