# Frame dashboard for the home NAS. Deploy with Portainer → Stacks → Add stack → Repository,
# compose path homeserver/docker-compose.yml, and set the environment variables (at least CALENDARS).
# Portainer clones the repo with its own git, so the NAS's Docker needs no git; the image is
# built on the NAS from this folder, so it matches the NAS's CPU. Also works with `docker compose up`.
services:
  frame:
    build:
      context: .
    image: frame-homeserver:local
    container_name: frame-homeserver
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8080"
    environment:
      TZ: ${TZ:-UTC}
      LAT: ${LAT:-}
      LON: ${LON:-}
      LOCATION_NAME: ${LOCATION_NAME:-}
      UNITS: ${UNITS:-imperial}
      # JSON array of calendars. The url values are secret iCal addresses: treat them as passwords.
      CALENDARS: ${CALENDARS:-[]}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-5}
      EVENTS_DAYS: ${EVENTS_DAYS:-14}
      ALERT_LEAD_MIN: ${ALERT_LEAD_MIN:-2}
      ALERT_COUNTDOWN_MIN: ${ALERT_COUNTDOWN_MIN:-15}
      ALERT_GRACE_MIN: ${ALERT_GRACE_MIN:-10}
      WRITE_TOKEN: ${WRITE_TOKEN:-}
      # Optional plain-text card, refreshed every 15 s, e.g. https://dadjokes736.com
      TEXT_FEED_URL: ${TEXT_FEED_URL:-}
      TEXT_FEED_TITLE: ${TEXT_FEED_TITLE:-}
      # Optional News tab: JSON [{"name","url"}] of RSS/Atom feeds (see .env.example)
      NEWS_FEEDS: ${NEWS_FEEDS:-}
      NEWS_MINUTES: ${NEWS_MINUTES:-10}
    volumes:
      - frame-data:/data

volumes:
  frame-data:
